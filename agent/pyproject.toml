[project]
name = "bridgit-agent"
version = "0.1.0"
description = "Bridgit setup, reconnaissance, MCP tooling, and driver generation"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
mcp = ["mcp>=1.2.0,<2"]
test = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bridgit_agent"]

